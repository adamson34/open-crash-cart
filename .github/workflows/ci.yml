name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install libusb
        run: brew install libusb

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run test suite
        run: swift run occ-tests

      - name: Code coverage (OCCKit)
        run: ./scripts/coverage.sh
